name: Build

# Build the current revision and publish the compiled mod JAR.

on:
  push:
    branches: [ main, fix/trade-request-confirmation ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace --console=plain
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: simpletrading-1.3.22-minecraft-26.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
